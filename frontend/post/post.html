<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Posts</title>
    <link rel="stylesheet" href="post.css">
    <link rel="stylesheet" href="../menu/menu.css">
    <link rel="shortcut icon" href="../../references/icon-manage-post.svg" type="image/svg">


</head>
<body>

    <div class="page-container">
        <!-- Top Header Navigation -->
        <header class="top-header">
            <h1 class="page-title">Manage Posts</h1>

        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Left Card: Post Data Form -->
            <section class="card form-card">
                <div class="card-header">
                    <span class="card-icon">📝</span>
                    <h2>Post Data</h2>
                </div>

                <form id="postForm" class="post-form">
                    <!-- Post ID Input & Search Actions -->
                    <div class="form-group">
                        <label for="inputId_post">Post ID</label>
                        <input type="number" id="inputId_post" placeholder="e.g. 101" class="form-control">
                    </div>

                    <div class="action-buttons-grid">
                        <button type="button" id="btProcure" class="btn btn-outline-primary">🔍 Search</button>
                        <button type="button" id="btInserir" class="btn btn-outline-primary" style="display: none;">➕ Insert</button>
                        <button type="button" id="btAlterar" class="btn btn-outline-primary" style="display: none;">✏️ Alter</button>
                        <button type="button" id="btExcluir" class="btn btn-outline-danger" style="display: none;">🗑️ Delete</button>
                    </div>

                    <!-- Searchable Creator Username Control -->
                    <div class="form-group">
                        <label for="inputSearch_username">Creator Username</label>
                        <div class="searchable-select-wrapper">
                            <input 
                                type="text" 
                                id="inputSearch_username" 
                                class="form-control" 
                                placeholder="Type to search account..." 
                                autocomplete="off"
                                disabled
                            >
                            <input type="hidden" id="selectUnique_username" name="username">
                            <div id="dropdown_username_list" class="custom-dropdown-list" style="display: none;"></div>
                        </div>
                    </div>

                    <!-- Caption Textarea -->
                    <div class="form-group">
                        <label for="inputContent_post">Caption</label>
                        <textarea id="inputContent_post" rows="3" placeholder="Write the post caption..." class="form-control" disabled></textarea>
                    </div>

                    <!-- Status / Notice Banner -->
                    <div id="divAviso" class="info-banner">
                        <span class="info-icon">ℹ️</span>
                        <span id="txtAviso">Enter ID and click Search</span>
                    </div>

                    <!-- Footer Control Buttons -->
                    <div class="form-footer-buttons">
                        <button type="button" id="btCancelar" class="btn btn-secondary">Cancel</button>
                        <button type="button" id="btSalvar" class="btn btn-primary" style="display: none;">💾 Save</button>
                    </div>
                </form>
            </section>

            <!-- Right Card: Image Upload -->
            <section class="card image-card">
                <div class="card-header">
                    <span class="card-icon">🖼️</span>
                    <h2>Image of Post</h2>
                </div>
                <p class="subtitle">(Click image to change)</p>

                <div class="dropzone" id="dropzoneArea">
                    <div class="preview-container">
                        <img id="imgPost" src="http://localhost:3001/images/silhueta.png" alt="Post Preview">
                    </div>
                    <div class="dropzone-text">
                        <p class="primary-text">Click or drag image to upload</p>
                        <p class="secondary-text">PNG up to 5MB</p>
                    </div>
                    <input type="file" id="inputImagem" accept="image/*" style="display: none;" disabled>
                </div>
            </section>
        </main>

        <!-- Bottom Card: Post List Table -->
        <section class="card table-card">
            <div class="table-header">
                <h2>Post List</h2>

            </div>

            <div class="table-wrapper">
                <table class="posts-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Caption</th>
                            <th>Creator</th>
                            <th>Image Ref</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="outputSaida">
                        <!-- Populated dynamically -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="post.js"></script>
    <script src="../menu/menu.js"></script>


</body>
</html>
